<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="description" content="RouteMaster — приложение курьера для сканирования накладных, валидации адресов и построения маршрута">
<title>RouteMaster</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
<div id="app"></div>

<!-- Toast container -->
<div id="toast-container"></div>

<!-- Templates -->
<template id="tpl-home">
  <div class="screen screen-home">
    <header class="app-header">
      <div class="app-logo">🚚 <span>RouteMaster</span></div>
    </header>
    <main class="home-main">
      <button class="btn btn-primary btn-large" data-action="paste-text">
        <span class="btn-icon">📋</span>
        <span>Вставить список</span>
        <span class="btn-sub">Ввести адреса текстом вручную</span>
      </button>
      <button class="btn btn-secondary btn-large" data-action="open-history">
        <span class="btn-icon">🕓</span>
        <span>Предыдущие туры</span>
        <span class="btn-sub">Посмотреть маршруты по датам</span>
      </button>
      <button class="btn btn-secondary btn-large" data-action="test-run">
        <span class="btn-icon">🧪</span>
        <span>Тестовый запуск</span>
        <span class="btn-sub">30 тестовых точек для проверки интерфейса</span>
      </button>
    </main>
    <footer class="home-footer">RouteMaster PWA · v2.2</footer>
  </div>
</template>

<template id="tpl-paste">
  <div class="screen screen-paste">
    <header class="app-header with-back">
      <button class="icon-btn" data-action="back-home">←</button>
      <h2>Вставить список адресов</h2>
    </header>
    <div class="paste-body">
      <p class="paste-hint">Каждый адрес — с новой строки. Можно вставить весь список сразу.</p>
      <textarea id="paste-textarea" class="paste-textarea" placeholder="Москва, ул. Ленина, д. 12&#10;Москва, пр. Мира, д. 45, кв. 3&#10;..."></textarea>
    </div>
    <footer class="sticky-footer">
      <button class="btn btn-primary btn-large" id="btn-paste-submit" data-action="paste-submit" disabled>
        Проверить адреса
      </button>
    </footer>
  </div>
</template>

<template id="tpl-scan">
  <div class="screen screen-scan">
    <div class="scan-loader">
      <div class="scan-spinner"></div>
      <h2 id="scan-title">Проверка адресов…</h2>
      <p id="scan-progress" class="scan-progress-text">Разбор списка адресов…</p>
      <div class="progress-bar"><div class="progress-bar-fill" id="scan-progress-fill"></div></div>
      <button class="btn btn-ghost" data-action="cancel-scan">Отмена</button>
    </div>
  </div>
</template>

<template id="tpl-validate">
  <div class="screen screen-validate">
    <header class="app-header with-back">
      <button class="icon-btn" data-action="back-home">←</button>
      <h2>Проверка адресов</h2>
      <span class="header-counter" id="validate-counter"></span>
    </header>
    <div class="validate-list" id="validate-list"></div>
    <footer class="sticky-footer">
      <button class="btn btn-primary btn-large" id="btn-confirm-validate" data-action="confirm-validate" disabled>
        Подтвердить и перейти к карте
      </button>
    </footer>
  </div>
</template>

<template id="tpl-build">
  <div class="screen screen-build">
    <header class="app-header with-back">
      <button class="icon-btn" data-action="back-validate">←</button>
      <h2>Сборка тура</h2>
      <button class="icon-btn" data-action="reset-numbering" title="Сбросить нумерацию">↺</button>
    </header>
    <div id="build-map" class="map-full"></div>
    <div class="build-hint">Коснитесь точек по порядку следования</div>
    <footer class="sticky-footer">
      <button class="btn btn-primary btn-large" id="btn-load-route" data-action="load-route" disabled>
        Загрузить RouteMaster
      </button>
    </footer>
  </div>
</template>

<template id="tpl-active">
  <div class="screen screen-active">
    <header class="app-header with-back">
      <button class="icon-btn" data-action="back-build">←</button>
      <div class="view-switch">
        <button class="switch-btn" data-view="map" data-action="switch-view">🗺 Карта</button>
        <button class="switch-btn active" data-view="list" data-action="switch-view">📋 Список</button>
        <button class="switch-btn" data-view="done" data-action="switch-view">✓ Готово</button>
        <button class="switch-btn" data-view="cancelled" data-action="switch-view">✕ Отменённые</button>
      </div>
      <span class="header-counter" id="active-counter"></span>
    </header>
    <div id="active-map" class="map-full hidden"></div>
    <div id="active-list" class="active-list"></div>
    <div id="active-done" class="active-list hidden"></div>
    <div id="active-cancelled" class="active-list hidden"></div>
    <footer class="sticky-footer">
      <button class="btn btn-primary btn-large" id="btn-end-tour" data-action="end-tour">Завершить тур</button>
    </footer>
  </div>
</template>

<template id="tpl-history">
  <div class="screen screen-history">
    <header class="app-header with-back">
      <button class="icon-btn" data-action="back-home">←</button>
      <h2>Предыдущие туры</h2>
    </header>
    <div class="history-list" id="history-list"></div>
  </div>
</template>

<template id="tpl-history-detail">
  <div class="screen screen-active">
    <header class="app-header with-back">
      <button class="icon-btn" data-action="back-history">←</button>
      <div class="view-switch">
        <button class="switch-btn" data-view="map" data-action="switch-view">🗺 Карта</button>
        <button class="switch-btn active" data-view="list" data-action="switch-view">📋 Список</button>
      </div>
      <span class="header-counter" id="history-detail-counter"></span>
    </header>
    <div id="history-detail-map" class="map-full hidden"></div>
    <div id="history-detail-list" class="active-list"></div>
  </div>
</template>

<!-- Bottom sheet -->
<div id="bottom-sheet-overlay" class="sheet-overlay hidden" data-action="close-sheet">
  <div class="bottom-sheet" id="bottom-sheet" onclick="event.stopPropagation()">
    <div class="sheet-handle"></div>
    <div id="sheet-content"></div>
  </div>
</div>

<!-- Context menu -->
<div id="context-menu-overlay" class="sheet-overlay hidden" data-action="close-context">
  <div class="context-menu">
    <div class="context-menu-title" id="context-menu-title">Статус точки</div>
    <button class="context-menu-item" data-status="skip">🚫 Не еду</button>
    <button class="context-menu-item" data-status="transferred">↪️ Передано другому</button>
    <button class="context-menu-item" data-status="cancel">Отмена</button>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-polylinedecorator@1.6.0/dist/leaflet.polylineDecorator.js"></script>
<script src="js/utils.js"></script>
<script src="js/storage.js"></script>
<script src="js/geocode.js"></script>
<script src="js/testdata.js"></script>
<script src="js/ui-home.js"></script>
<script src="js/ui-paste.js"></script>
<script src="js/ui-scan.js"></script>
<script src="js/ui-validate.js"></script>
<script src="js/ui-build.js"></script>
<script src="js/ui-active.js"></script>
<script src="js/ui-history.js"></script>
<script src="js/ui-history-detail.js"></script>
<script src="js/router.js"></script>
<script src="js/app.js"></script>
</body>
</html>
