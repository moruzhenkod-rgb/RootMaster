<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="description" content="RouteMaster — приложение курьера для сканирования накладных, валидации адресов и построения маршрута">
<title>RouteMaster</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="vendor/cropper.min.css">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
<div id="app"></div>
<div id="rm-radar-active" class="rm-radar-active" style="display:none"></div>
<template id="tpl-clients">
  <div class="screen screen-clients">
    <header class="app-header with-back">
      <button class="icon-btn" data-action="back-home">←</button>
      <h2>Мои клиенты</h2>
      <button class="icon-btn" data-action="select-all" title="Выбрать все">☑</button>
    </header>
    <input id="clients-search" class="clients-search" placeholder="🔍 Поиск по фирме или адресу" />
    <div id="clients-list" class="clients-list"></div>
    <footer class="sticky-footer">
      <button class="btn btn-primary btn-large" id="btn-add-clients" data-action="add-clients" disabled>Добавить в тур (0)</button>
    </footer>
  </div>
</template>
<template id="tpl-manual">
  <div class="screen screen-clients">
    <header class="app-header with-back">
      <button class="icon-btn" data-action="back-home">←</button>
      <h2>Ручная загрузка тура</h2>
    </header>
    <div class="clients-list">
      <div class="manual-add-box">
        <button class="btn btn-primary" data-action="cam-open" style="width:100%;margin-bottom:12px">📷 Сканировать этикетку (сканер)</button>
        <div class="manual-add-title">➕ Или ввести вручную</div>
        <input id="m-company" placeholder="Фирма (необязательно)" />
        <input id="m-address" placeholder="Адрес: улица дом, индекс город" />
        <div class="edit-row">
          <input id="m-key" placeholder="Ключ (необязательно)" />
          <button class="btn btn-secondary" data-action="manual-add-point">Добавить</button>
        </div>
      </div>
      <div id="manual-new-list"></div>
      <div class="manual-sep">— или выбрать из базы —</div>
      <input id="manual-search" class="clients-search" placeholder="🔍 Поиск по фирме или адресу" />
      <div id="manual-clients-list"></div>
    </div>
    <footer class="sticky-footer">
      <button class="btn btn-primary btn-large" id="btn-manual-build" data-action="manual-build" disabled>Собрать тур (0)</button>
    </footer>
    <div id="cam-overlay" class="cam-overlay" style="display:none">
      <video id="cam-video" playsinline autoplay muted></video>
      <div class="cam-frame"></div>
      <div class="cam-status" id="cam-status"></div>
      <div class="cam-controls">
        <button class="btn btn-ghost" data-action="cam-close">Готово</button>
        <button class="btn btn-primary" data-action="cam-shot">📸 Скан сейчас</button>
      </div>
    </div>
  </div>
</template>
<template id="tpl-settings">
  <div class="screen screen-clients">
    <header class="app-header with-back">
      <button class="icon-btn" data-action="back-home">←</button>
      <h2>Настройки</h2>
    </header>
    <div class="set-tabs">
      <button class="set-tab active" data-tab="dupes">Дубликаты</button>
      <button class="set-tab" data-tab="nogeo">Без гео</button>
      <button class="set-tab" data-tab="cells">Ячейки/Фирмы</button>
      <button class="set-tab" data-tab="test">Самотест</button>
    </div>
    <div id="set-content" class="clients-list"></div>
    <div id="set-modal" class="set-modal" style="display:none"></div>
  </div>
</template>
<template id="tpl-radar">
  <div class="screen screen-radar">
    <header class="app-header with-back">
      <button class="icon-btn" data-action="back-home">←</button>
      <h2>Радар-детектор</h2>
    </header>
    <div class="radar-body">
      <button id="radar-main-btn" class="radar-circle" data-action="radar-toggle" data-state="idle">
        <span class="radar-circle-label">СТАРТ</span>
        <span class="radar-circle-spinner"></span>
        <svg class="radar-chevrons" viewBox="0 0 24 24" aria-hidden="true">
          <polyline points="6 15 12 9 18 15"></polyline>
          <polyline points="6 11 12 5 18 11"></polyline>
          <polyline points="6 19 12 13 18 19"></polyline>
        </svg>
      </button>
      <p class="radar-status-text" id="radar-status-text">Детектор выключен</p>
      <p class="radar-hint">Камеры контроля скорости, аварии и дорожные работы по ходу движения</p>
      <div class="radar-db-row">
        <span class="radar-db-status" id="radar-db-status">База камер: нет данных</span>
        <button class="radar-db-refresh" id="radar-db-refresh" data-action="radar-refresh-db" title="Обновить базу камер">↻ Обновить</button>
      </div>
      <div class="radar-vol-row">
        <span class="radar-vol-icon">🔊 Громкость</span>
        <input type="range" id="radar-volume" min="0" max="30" step="0.5" value="7">
        <span id="radar-vol-val" class="radar-vol-val">7</span>
      </div>
      <button class="btn btn-secondary" data-action="open-radar-map">🗺 Карта камер</button>
    </div>
  </div>
  <div id="radar-map-modal" class="radar-map-modal" style="display:none">
    <div class="radar-map-card">
      <div class="radar-map-head">
        <h3>Карта камер</h3>
        <span class="radar-db-status" id="radar-map-db-status"></span>
        <button class="radar-db-refresh" id="radar-map-db-refresh" data-action="radar-refresh-db" title="Обновить базу камер">↻</button>
        <button class="icon-btn" data-action="close-radar-map">✕</button>
      </div>
      <div id="radar-map" class="radar-map"></div>
    </div>
  </div>
</template>
<template id="tpl-radar2">
  <div class="screen screen-radar2">
    <div id="r2-simple" class="r2-simple">
      <header class="app-header with-back">
        <button class="icon-btn" data-action="back-home">←</button>
        <span id="r2-status" class="r2-status2">База камер: …</span>
      </header>
      <div class="r2-hud2">
        <div id="r2-speed-box" class="r2-speed-box"><div id="r2-speed" class="r2-speed">0</div><small>км/ч</small></div>
        <div id="r2-limit-box" class="r2-limit-box"><div id="r2-limit" class="r2-limit">—</div><small id="r2-dist"></small></div>
      </div>
      <div class="r2-tri-wrap"><div class="r2-triangle">▲</div></div>
      <div id="r2-alert" class="r2-alert2">Нажми СТАРТ</div>
      <div class="r2-volrow"><span class="r2-volicon">🔊</span><input type="range" id="r2-vol" min="0" max="30" step="0.5" value="7" class="r2-vol"></div>
      <div class="r2-actions2">
        <button id="r2-btn" class="r2-startbtn" data-action="r2-toggle">СТАРТ</button>
        <button class="r2-mapbtn" data-action="r2-openmap">🗺 Карта</button>
      </div>
    </div>
    <div id="r2-map-wrap" class="r2-map-wrap" style="display:none"><div id="r2-map" class="r2-map"></div></div>
    <div id="r2-mapcar" class="r2-mapcar" style="display:none">▲</div>
    <button class="r2-map-close" data-action="r2-closemap" style="display:none">← Назад</button>
    <button class="r2-recenter" data-action="r2-recenter" style="display:none">🎯</button>
  </div>
</template>
<template id="tpl-auth">
  <div class="screen screen-auth">
    <div id="auth-box"></div>
  </div>
</template>
<template id="tpl-home">
  <div class="screen screen-home">
    <header class="app-header">
      <div class="app-logo">🚚 <span>RouteMaster</span> <span class="app-version" id="app-version"></span></div>
      <div class="home-profile">
        <span class="home-user" id="home-user"></span>
        <button class="home-logout" data-action="logout">Выйти</button>
      </div>
    </header>
    <main class="home-main">
      <button class="btn btn-primary btn-large" id="btn-my-tour" data-action="open-tour" style="display:none">
        <span class="btn-icon">🚚</span>
        <span>Мой тур</span>
        <span class="btn-sub">Вернуться к загруженному маршруту</span>
      </button>
      <button class="btn btn-primary btn-large" data-action="paste-text">
        <span class="btn-icon">📋</span>
        <span>Вставить список</span>
        <span class="btn-sub">Ввести адреса текстом вручную</span>
      </button>
      <button class="btn btn-primary btn-large" data-action="open-manual">
        <span class="btn-icon">🧰</span>
        <span>Ручная загрузка тура</span>
        <span class="btn-sub">Выбрать из базы или ввести вручную</span>
      </button>
      <button class="btn btn-secondary btn-large" data-action="open-clients">
        <span class="btn-icon">🗂</span>
        <span>Мои клиенты</span>
        <span class="btn-sub">Постоянные адреса — добавить в тур</span>
      </button>
      <button class="btn btn-secondary btn-large" data-action="open-radar">
        <span class="btn-icon">🚨</span>
        <span>Радар-детектор</span>
        <span class="btn-sub">Камеры, аварии, дорожные работы</span>
      </button>
      <button class="btn btn-secondary btn-large" data-action="open-settings">
        <span class="btn-icon">⚙️</span>
        <span>Настройки</span>
        <span class="btn-sub">Дубликаты · без гео · ячейки · самотест</span>
      </button>
      <button class="btn btn-secondary btn-large" data-action="open-active-users">
        👥 Активные пользователи
      </button>
      <button class="btn btn-secondary btn-large" data-action="open-history">
        <span class="btn-icon">🕓</span>
        <span>Предыдущие туры</span>
        <span class="btn-sub">Посмотреть маршруты по датам</span>
      </button>
    </main>
    <footer class="home-footer">RouteMaster PWA · v49</footer>
  </div>
</template>

<template id="tpl-paste">
  <div class="screen screen-paste">
    <header class="app-header with-back">
      <button class="icon-btn" data-action="back-home">←</button>
      <h2>Вставить список адресов</h2>
    </header>
    <div class="paste-body">
      <div class="paste-photo-row">
        <button class="btn btn-primary" data-action="paste-photo">📷 Сфотать список</button>
        <button class="btn btn-secondary" data-action="paste-gallery">🖼 Из галереи</button>
      </div>
      <div id="paste-ocr-status" class="paste-ocr-status"></div>
      <div id="paste-progress" class="paste-progress" hidden>
        <div class="paste-progress-track"><div id="paste-progress-fill" class="paste-progress-fill"></div></div>
        <div id="paste-progress-pct" class="paste-progress-pct">0%</div>
      </div>
      <input type="file" id="paste-photo" accept="image/*" capture="environment" multiple hidden>
      <input type="file" id="paste-gallery" accept="image/*" multiple hidden>
      <p class="paste-hint">Сфоткай лист(ы) — распознает наш Claude. Несколько листов: в камере снимай по одному и жми «Ещё лист», или выбери сразу из галереи — склею в один список. Или впиши вручную. Срочные по времени подсветятся ⏰.</p>
      <textarea id="paste-textarea" class="paste-textarea" placeholder="Фирма — Улица дом, индекс город — Ключ: ..."></textarea>
      <div id="cam-more" class="cam-more" hidden>
        <div class="cam-more-card">
          <div class="cam-more-count" id="cam-more-count"></div>
          <p class="cam-more-hint">Обрезка только если нужно (по умолчанию — полное качество). Сними следующий лист или распознай.</p>
          <button class="btn btn-secondary" data-action="cam-more">📷 Ещё лист</button>
          <button class="btn btn-secondary" data-action="cam-edit">✏️ Обрезать/повернуть последний</button>
          <button class="btn btn-primary" data-action="cam-done">✓ Распознать</button>
          <button class="btn btn-ghost" data-action="cam-cancel">Отмена</button>
        </div>
      </div>
    </div>
    <footer class="sticky-footer">
      <button class="btn btn-primary btn-large" id="btn-paste-submit" data-action="paste-submit" disabled>
        Проверить адреса
      </button>
    </footer>
  </div>
</template>

<template id="tpl-scan">
  <div class="screen screen-scan">
    <div class="scan-loader">
      <div class="scan-spinner"></div>
      <h2 id="scan-title">Проверка адресов…</h2>
      <p id="scan-progress" class="scan-progress-text">Разбор списка адресов…</p>
      <div class="progress-bar"><div class="progress-bar-fill" id="scan-progress-fill"></div></div>
      <button class="btn btn-ghost" data-action="cancel-scan">Отмена</button>
    </div>
  </div>
</template>

<template id="tpl-validate">
  <div class="screen screen-validate">
    <header class="app-header with-back">
      <button class="icon-btn" data-action="back-home">←</button>
      <h2>Проверка адресов</h2>
      <span class="header-counter" id="validate-counter"></span>
    </header>
    <button class="btn btn-secondary" id="btn-add-client" data-action="add-client" style="margin:10px 14px 0">➕ Добавить клиента</button>
    <div class="validate-list" id="validate-list"></div>
    <footer class="sticky-footer">
      <button class="btn btn-primary btn-large" id="btn-confirm-validate" data-action="confirm-validate" disabled>
        Подтвердить и перейти к карте
      </button>
    </footer>
  </div>
</template>

<template id="tpl-build">
  <div class="screen screen-build">
    <header class="app-header with-back">
      <button class="icon-btn" data-action="back-validate">←</button>
      <h2>Сборка тура</h2>
      <button class="icon-btn" data-action="save-tour" title="Сохранить адреса">💾</button>
      <button class="icon-btn" data-action="reset-numbering" title="Сбросить нумерацию">↺</button>
    </header>
    <div id="build-map" class="map-full"></div>
    <div class="build-hint">Коснитесь точек по порядку следования</div>
    <div id="move-confirm" class="move-confirm hidden">
      <span class="move-confirm-text">Точка перемещена</span>
      <button class="btn btn-success" data-action="confirm-move">✓ Подтвердить</button>
      <button class="btn btn-ghost" data-action="cancel-move">Отменить</button>
    </div>
    <footer class="sticky-footer build-footer">
      <button class="btn-auto-route" data-action="auto-route">🧭 Авто-маршрут</button>
      <button class="btn btn-primary btn-large" id="btn-load-route" data-action="load-route" disabled>
        Загрузить RouteMaster
      </button>
    </footer>
  </div>
</template>

<template id="tpl-active">
  <div class="screen screen-active">
    <header class="app-header with-back">
      <button class="icon-btn" data-action="back-build">←</button>
      <div class="view-switch">
        <button class="switch-btn" data-view="map" data-action="switch-view">🗺 Карта</button>
        <button class="switch-btn active" data-view="list" data-action="switch-view">📋 Список</button>
        <button class="switch-btn" data-view="done" data-action="switch-view">✓ Готово</button>
        <button class="switch-btn" data-view="cancelled" data-action="switch-view">✕ Отменённые</button>
      </div>
      <span class="header-counter" id="active-counter"></span>
    </header>
    <div id="active-map" class="map-full hidden"></div>
    <input id="active-search" class="active-search" placeholder="🔍 Поиск по туру: индекс, улица, фирма, ключ">
    <div id="active-list" class="active-list"></div>
    <div id="active-done" class="active-list hidden"></div>
    <div id="active-cancelled" class="active-list hidden"></div>
    <button class="fab-add" data-action="add-parcel" title="Добавить посылку">➕</button>
    <footer class="sticky-footer">
      <button class="btn btn-primary btn-large" id="btn-end-tour" data-action="end-tour">Завершить тур</button>
    </footer>
  </div>
</template>

<template id="tpl-history">
  <div class="screen screen-history">
    <header class="app-header with-back">
      <button class="icon-btn" data-action="back-home">←</button>
      <h2>Предыдущие туры</h2>
    </header>
    <div class="history-list" id="history-list"></div>
  </div>
</template>

<template id="tpl-history-detail">
  <div class="screen screen-active">
    <header class="app-header with-back">
      <button class="icon-btn" data-action="back-history">←</button>
      <div class="view-switch">
        <button class="switch-btn" data-view="map" data-action="switch-view">🗺 Карта</button>
        <button class="switch-btn active" data-view="list" data-action="switch-view">📋 Список</button>
      </div>
      <span class="header-counter" id="history-detail-counter"></span>
    </header>
    <div id="history-detail-map" class="map-full hidden"></div>
    <div id="history-detail-list" class="active-list"></div>
  </div>
</template>

<!-- Bottom sheet -->
<div id="bottom-sheet-overlay" class="sheet-overlay hidden" data-action="close-sheet">
  <div class="bottom-sheet" id="bottom-sheet" onclick="event.stopPropagation()">
    <div class="sheet-handle"></div>
    <div id="sheet-content"></div>
  </div>
</div>

<!-- Context menu -->
<div id="context-menu-overlay" class="sheet-overlay hidden" data-action="close-context">
  <div class="context-menu">
    <div class="context-menu-title" id="context-menu-title">Статус точки</div>
    <button class="context-menu-item" data-status="skip">🚫 Не еду</button>
    <button class="context-menu-item" data-status="transferred">↪️ Передано другому</button>
    <button class="context-menu-item" data-status="cancel">Отмена</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<template id="tpl-active-users">
  <div class="screen">
    <header class="app-header with-back">
      <button class="icon-btn" data-action="back-home">←</button>
      <h2>Активные пользователи</h2>
      <button class="icon-btn" data-action="refresh-active" title="Обновить">🔄</button>
    </header>
    <div class="au-list" id="au-list"><div class="empty-hint">Загрузка…</div></div>
  </div>
</template>

<template id="tpl-user-detail">
  <div class="screen">
    <header class="app-header with-back">
      <button class="icon-btn" data-action="back-active">←</button>
      <h2 id="ud-name">Пользователь</h2>
      <button class="icon-btn" data-action="refresh-detail" title="Обновить">🔄</button>
    </header>
    <div id="ud-map" class="ud-map"></div>
    <div id="ud-stats" class="ud-stats"></div>
    <div class="active-list" id="ud-list"></div>
  </div>
</template>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-polylinedecorator@1.6.0/dist/leaflet.polylineDecorator.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/storage.js"></script>
<script src="js/geocode.js"></script>
<script src="js/client-match.js"></script>
<script src="js/place-picker.js"></script>
<script src="js/radar/db.js"></script>
<script src="js/radar/traffic.js"></script>
<script src="js/radar/radar-engine.js"></script>
<script src="js/radar/ui-radar-v2.js"></script>
<script src="js/cam-scanner.js"></script>
<script src="js/audio-manager.js"></script>
<script src="js/radar-module.js"></script>
<script src="js/testdata.js"></script>
<script src="js/ui-home.js"></script>
<script src="vendor/cropper.min.js"></script>
<script src="js/ui-paste.js"></script>
<script src="js/ui-scan.js"></script>
<script src="js/ui-validate.js"></script>
<script src="js/ui-build.js"></script>
<script src="js/ui-active.js"></script>
<script src="js/ui-history.js"></script>
<script src="js/ui-history-detail.js"></script>
<script src="js/ui-auth.js"></script>
<script src="js/ui-clients.js"></script>
<script src="js/ui-manual.js"></script>
<script src="js/ui-settings.js"></script>
<script src="js/ui-radar.js"></script>
<script src="js/ui-active-users.js"></script>
<script src="js/router.js"></script>
<script src="js/app.js"></script>
<div id="photo-editor" class="photo-editor" hidden>
  <div class="pe-canvas-wrap"><img id="pe-image" alt=""></div>
  <div class="pe-toolbar">
    <button class="pe-btn" data-pe="rot-left">↺ Влево</button>
    <button class="pe-btn" data-pe="rot-right">↻ Вправо</button>
    <button class="pe-btn" data-pe="reset">⟲ Сброс</button>
  </div>
  <div class="pe-actions">
    <button class="btn btn-ghost" data-pe="cancel">Отмена</button>
    <button class="btn btn-primary" data-pe="done">Готово ✓</button>
  </div>
</div>
</body>
</html>
